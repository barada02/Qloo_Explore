<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qloo Explorer</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#3a5bd9; --ok:#1f8a4c; --bad:#c23b22; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1e1e1c; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7f9bff; --ok:#4cc27e; --bad:#ff7a63; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:baseline; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  #status { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button { flex:1; }
  button { font:inherit; padding:7px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary, .tabs button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:8px; border-radius:6px; cursor:pointer; }
  li:hover, li.active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  li small { display:block; color:var(--muted); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  textarea, select, input { width:100%; font:13px ui-monospace, monospace; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  textarea { min-height:160px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:60vh; font-size:12px; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin:10px 0; }
  .card { border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; overflow-wrap:anywhere; }
  .card img { width:100%; height:110px; object-fit:cover; border-radius:4px; }
  .card small { color:var(--muted); display:block; }
</style>
</head>
<body>
<header><h1>Qloo Explorer</h1><span id="status">connecting…</span></header>
<main>
  <section>
    <div class="tabs"><button id="tab-mcp" class="active">MCP tools</button><button id="tab-rest">Raw REST</button></div>
    <ul id="tools"></ul>
    <div id="rest-form" hidden>
      <label for="rest-path">Endpoint</label>
      <select id="rest-path"></select>
    </div>
  </section>
  <section>
    <div id="desc" style="color:var(--muted)">Pick a tool on the left.</div>
    <label for="args">Arguments (JSON)</label>
    <textarea id="args" spellcheck="false">{}</textarea>
    <p><button class="primary" id="run">Run</button> <span id="meta"></span></p>
    <div class="cards" id="cards"></div>
    <details><summary>Raw response</summary><pre id="out"></pre></details>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const REST = {
  "/search": { query: "Radiohead", types: "urn:entity:artist", take: 5 },
  "/entities": { entity_ids: "<paste an entity id>" },
  "/v2/tags": { "filter.query": "cozy mystery", "feature.semantic_search": true, take: 10 },
  "/v2/tags/types": {},
  "/v2/audiences": { take: 10 },
  "/v2/audiences/types": {},
  "/v2/insights": { "filter.type": "urn:entity:place", "signal.interests.entities": "<entity id>", "filter.location.query": "Lisbon", take: 10 },
  "/v2/analysis/compare": { "a.signal.interests.entities": "<id>", "b.signal.interests.entities": "<id>", take: 10 },
  "/v2/trending": { "filter.type": "urn:entity:artist", take: 10 },
  "/": {},
};
let mode = "mcp", current = null;

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const json = await res.json();
  if (!res.ok) throw new Error(json.error ?? res.statusText);
  return json;
}

function setMode(next) {
  mode = next;
  $("tab-mcp").classList.toggle("active", mode === "mcp");
  $("tab-rest").classList.toggle("active", mode === "rest");
  $("tools").hidden = mode !== "mcp";
  $("rest-form").hidden = mode !== "rest";
  if (mode === "rest") pickRest($("rest-path").value);
}

function pickTool(tool, li) {
  current = tool;
  document.querySelectorAll("#tools li").forEach((el) => el.classList.toggle("active", el === li));
  $("desc").textContent = tool.description ?? "";
  $("args").value = JSON.stringify(tool.example ?? {}, null, 2);
}

function pickRest(path) {
  $("desc").textContent = `GET ${path} with these query parameters (arrays are comma-joined).`;
  $("args").value = JSON.stringify(REST[path], null, 2);
}

function renderCards(items) {
  $("cards").innerHTML = "";
  for (const item of (items ?? []).slice(0, 20)) {
    if (!item || typeof item !== "object") continue;
    const card = document.createElement("div");
    card.className = "card";
    const img = item.properties?.image?.url ?? item.image?.url;
    if (img) { const el = document.createElement("img"); el.src = img; el.alt = ""; card.append(el); }
    const title = document.createElement("strong");
    title.textContent = item.name ?? item.title ?? item.entity_id ?? item.id ?? "";
    card.append(title);
    const sub = document.createElement("small");
    sub.textContent = [item.type ?? item.subtype, (item.query?.affinity ?? item.affinity) != null ? `affinity ${(+(item.query?.affinity ?? item.affinity)).toFixed(2)}` : ""].filter(Boolean).join(" · ");
    card.append(sub);
    card.title = JSON.stringify(item, null, 2).slice(0, 2000);
    $("cards").append(card);
  }
}

async function run() {
  let args;
  try { args = JSON.parse($("args").value || "{}"); } catch (e) { $("meta").innerHTML = `<span class="bad">Invalid JSON: ${e.message}</span>`; return; }
  $("meta").textContent = "running…"; $("out").textContent = ""; $("cards").innerHTML = "";
  try {
    if (mode === "mcp") {
      if (!current) throw new Error("Pick a tool first.");
      const { ms, envelope } = await api("/api/tool", { name: current.name, arguments: args });
      const good = ["ok", "partial", "degraded"].includes(envelope.status);
      $("meta").innerHTML = `<span class="pill ${good ? "ok" : "bad"}">${envelope.status}</span> ${ms} ms · ${envelope.summary ?? ""}`;
      renderCards(Array.isArray(envelope.results) ? envelope.results : envelope.series);
      $("out").textContent = JSON.stringify(envelope, null, 2);
    } else {
      const res = await api("/api/rest", { path: $("rest-path").value, params: args });
      $("meta").innerHTML = `<span class="pill ${res.ok ? "ok" : "bad"}">HTTP ${res.status}</span> ${res.ms} ms · ${res.url}`;
      const results = res.body?.results;
      renderCards(Array.isArray(results) ? results : results && Object.values(results).find(Array.isArray));
      $("out").textContent = JSON.stringify(res.body ?? res, null, 2);
    }
  } catch (e) {
    $("meta").innerHTML = `<span class="bad">${e.message}</span>`;
  }
}

async function init() {
  for (const path of Object.keys(REST)) $("rest-path").add(new Option(path, path));
  $("rest-path").onchange = (e) => pickRest(e.target.value);
  $("tab-mcp").onclick = () => setMode("mcp");
  $("tab-rest").onclick = () => setMode("rest");
  $("run").onclick = run;
  try {
    const status = await api("/api/status");
    $("status").textContent = `${status.baseUrl} · key ${status.hasKey ? "set" : "MISSING"}`;
    const tools = await api("/api/tools");
    for (const tool of tools) {
      const li = document.createElement("li");
      li.innerHTML = `<strong></strong><small></small>`;
      li.querySelector("strong").textContent = tool.name;
      li.querySelector("small").textContent = (tool.description ?? "").slice(0, 90);
      li.onclick = () => pickTool(tool, li);
      $("tools").append(li);
    }
  } catch (e) {
    $("status").innerHTML = `<span class="bad">${e.message}</span>`;
  }
}
init();
</script>
</body>
</html>
