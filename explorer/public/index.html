<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qloo Explorer</title>
<style>
  :root { --bg:#f7f7f5; --panel:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e2e2dc; --accent:#3a5bd9; --ok:#1f8a4c; --bad:#c23b22; --warn:#a86a00; --chip:#eeeeea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --panel:#1e1e1c; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7f9bff; --ok:#4cc27e; --bad:#ff7a63; --warn:#e0a63a; --chip:#2a2a27; } }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  h2 { font-size:16px; margin:0 0 4px; } h3 { font-size:13px; margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); }
  #status { color:var(--muted); font-size:13px; }
  nav { display:flex; gap:6px; margin-left:auto; }
  button { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.primary, nav button.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.small { padding:2px 8px; font-size:12px; }
  main { padding:16px 20px; }
  .split { display:grid; grid-template-columns: 300px 1fr; gap:16px; align-items:start; }
  @media (max-width: 860px) { .split { grid-template-columns: 1fr; } }
  section, .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; min-width:0; }
  .side { position:sticky; top:8px; max-height:calc(100vh - 80px); overflow:auto; }
  .side h3:first-child { margin-top:0; }
  ul { list-style:none; margin:0; padding:0; }
  li.item { padding:6px 8px; border-radius:6px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  li.item:hover, li.item.active { background:color-mix(in srgb, var(--accent) 12%, transparent); }
  li.item small, .muted { color:var(--muted); }
  code, .mono { font:12px ui-monospace, monospace; }
  .chip { display:inline-block; background:var(--chip); border-radius:4px; padding:0 6px; margin:1px 2px 1px 0; font:11px ui-monospace, monospace; white-space:nowrap; }
  th:last-child, td:last-child { min-width:240px; }
  .pill { display:inline-block; padding:0 8px; border-radius:99px; font-size:12px; border:1px solid currentColor; white-space:nowrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; font-size:12px; color:var(--muted); font-weight:600; position:sticky; top:0; background:var(--panel); }
  th, td { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  td.name { font:12px ui-monospace, monospace; font-weight:600; overflow-wrap:anywhere; min-width:150px; }
  tr.click { cursor:pointer; } tr.click:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .scroll { overflow:auto; max-height:70vh; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0; }
  .toolbar input, .toolbar select, textarea, select.full { font:13px ui-monospace, monospace; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
  .toolbar input { flex:1; min-width:160px; }
  textarea { width:100%; min-height:160px; }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; max-height:55vh; font-size:12px; margin:6px 0; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap:8px; margin:10px 0; }
  .card { border:1px solid var(--line); border-radius:6px; padding:8px; font-size:13px; overflow-wrap:anywhere; }
  .card img { width:100%; height:110px; object-fit:cover; border-radius:4px; }
  .card small { color:var(--muted); display:block; }
  dialog { width:min(1000px, 94vw); max-height:90vh; border:1px solid var(--line); border-radius:10px; background:var(--panel); color:var(--ink); padding:16px; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Qloo Explorer</h1><span id="status">connecting…</span>
  <nav>
    <button data-view="reference" class="active">Reference</button>
    <button data-view="results">All saved results</button>
    <button data-view="playground">Playground</button>
  </nav>
</header>
<main>
  <div id="view-reference" class="split">
    <section class="side"><div id="sidebar"></div></section>
    <section id="detail"><span class="muted">Pick an endpoint or tool on the left.</span></section>
  </div>

  <section id="view-results" hidden>
    <div class="toolbar">
      <input id="res-filter" placeholder="Filter by name, endpoint, parameter or result text…">
      <select id="res-kind"><option value="">REST + MCP</option><option value="rest">REST only</option><option value="mcp">MCP only</option></select>
      <select id="res-ok"><option value="">Any outcome</option><option value="ok">Succeeded</option><option value="bad">Failed / needs input</option></select>
      <span class="muted" id="res-count"></span>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>Call</th><th>Endpoint / tool</th><th>Result</th><th>ms</th><th>Items</th><th>Sample</th></tr></thead>
      <tbody id="res-body"></tbody>
    </table></div>
  </section>

  <div id="view-playground" class="split" hidden>
    <section class="side">
      <div class="row" style="margin-bottom:10px"><button id="tab-mcp" class="primary" style="flex:1">MCP tools</button><button id="tab-rest" style="flex:1">Raw REST</button></div>
      <ul id="tools"></ul>
      <div id="rest-form" hidden><label for="rest-path">Endpoint</label><select id="rest-path" class="full" style="width:100%"></select></div>
    </section>
    <section>
      <div id="desc" class="muted">Pick a tool on the left.</div>
      <label for="args">Arguments (JSON)</label>
      <textarea id="args" spellcheck="false">{}</textarea>
      <p><button class="primary" id="run">Run live</button> <span id="meta"></span></p>
      <div class="cards" id="cards"></div>
      <details><summary>Raw response</summary><pre id="out"></pre></details>
    </section>
  </div>
</main>

<dialog id="viewer">
  <div class="row" style="justify-content:space-between"><h2 id="v-title"></h2><button id="v-close">Close</button></div>
  <div id="v-meta" class="muted"></div>
  <h3>Request</h3><pre id="v-req"></pre>
  <h3>Result</h3><div class="cards" id="v-cards"></div>
  <details open><summary>Full response JSON</summary><pre id="v-out"></pre></details>
  <p><button class="primary" id="v-load">Load into playground</button></p>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
// Tiny DOM builder: h("div", {class:"x", onclick}, child, "text")
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs ?? {})) {
    if (value === undefined || value === false) continue;
    if (key.startsWith("on")) el[key] = value; else el.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child != null && child !== false) el.append(child.nodeType ? child : document.createTextNode(child));
  return el;
}

const REST_DEFAULTS = {
  "/search": { query: "Radiohead", types: "urn:entity:artist", take: 5 },
  "/entities": { entity_ids: "<paste an entity id>" },
  "/v2/tags": { "filter.query": "cozy mystery", "feature.semantic_search": true, take: 10 },
  "/v2/tags/types": {},
  "/v2/audiences": { "filter.parents.types": "urn:audience:communities", take: 10 },
  "/v2/audiences/types": {},
  "/v2/insights": { "filter.type": "urn:entity:place", "signal.interests.entities": "<entity id>", "filter.location.query": "Lisbon", take: 10 },
  "/v2/analysis/compare": { "a.signal.interests.entities": "<id>", "b.signal.interests.entities": "<id>", take: 10 },
  "/v2/trending": { "filter.type": "urn:entity:artist", "signal.interests.entities": "<id>", "filter.start_date": "2026-01-01", "filter.end_date": "2026-09-30", take: 10 },
  "/": {},
};
const state = { reference: [], tools: [], results: [], toolsError: null, selected: null, viewing: null };

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
  const json = await res.json();
  if (!res.ok) throw new Error(json.error ?? res.statusText);
  return json;
}

// ---------- views ----------
function showView(name) {
  for (const view of ["reference", "results", "playground"]) $("view-" + view).hidden = view !== name;
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("active", b.dataset.view === name));
}

// ---------- shared rendering ----------
const compact = (params) => Object.entries(params ?? {}).map(([k, v]) => `${k}=${Array.isArray(v) ? v.join(",") : v}`).join("  ");
const badge = (row) => h("span", { class: "pill " + (row.ok ? "ok" : row.status === "needs_input" ? "warn" : "bad") }, row.kind === "rest" ? `HTTP ${row.status}` : row.status);

function renderCards(container, items) {
  container.replaceChildren();
  for (const item of (items ?? []).slice(0, 24)) {
    if (!item || typeof item !== "object") continue;
    const card = h("div", { class: "card", title: JSON.stringify(item, null, 2).slice(0, 2000) });
    const img = item.properties?.image?.url ?? item.image?.url;
    if (img) card.append(h("img", { src: img, alt: "", loading: "lazy" }));
    const affinity = item.query?.affinity ?? item.affinity;
    card.append(
      h("strong", {}, item.name ?? item.title ?? item.entity_id ?? item.id ?? item.date ?? (item.location ? `${item.location.latitude}, ${item.location.longitude}` : "")),
      h("small", {}, [item.type ?? item.subtype, affinity != null ? `affinity ${(+affinity).toFixed(2)}` : "", item.population_percentile != null ? `percentile ${(+item.population_percentile).toFixed(3)}` : ""].filter(Boolean).join(" · ")),
    );
    container.append(card);
  }
}

const listOf = (body) => {
  const results = body?.results ?? body;
  if (Array.isArray(results)) return results;
  return results && typeof results === "object" ? Object.values(results).find(Array.isArray) : undefined;
};

// ---------- saved-result viewer ----------
async function openSaved(row) {
  state.viewing = row;
  $("v-title").textContent = `${row.name}  ·  ${row.endpoint}`;
  $("v-meta").replaceChildren(badge(row), ` ${row.ms != null ? row.ms + " ms · " : ""}${row.count} items${row.error ? " · " + row.error : ""}`);
  $("v-req").textContent = JSON.stringify(row.params ?? {}, null, 2);
  $("v-cards").replaceChildren(); $("v-out").textContent = "loading…";
  $("viewer").showModal();
  try {
    const saved = await api(`/api/results/${row.kind}/${encodeURIComponent(row.name)}`);
    if (row.kind === "rest") {
      renderCards($("v-cards"), listOf(saved.response.body));
      $("v-out").textContent = JSON.stringify(saved.response, null, 2);
    } else {
      const e = saved.envelope;
      renderCards($("v-cards"), Array.isArray(e.results) ? e.results : e.series);
      $("v-out").textContent = JSON.stringify(e, null, 2);
    }
  } catch (e) { $("v-out").textContent = e.message; }
}

function loadIntoPlayground(row) {
  $("viewer").close();
  showView("playground");
  if (row.kind === "mcp") {
    setMode("mcp");
    const li = [...document.querySelectorAll("#tools li")].find((el) => el.dataset.name === row.endpoint);
    const tool = state.tools.find((t) => t.name === row.endpoint);
    if (tool) pickTool(tool, li);
  } else {
    setMode("rest");
    $("rest-path").value = row.endpoint;
    pickRest(row.endpoint);
  }
  $("args").value = JSON.stringify(row.params ?? {}, null, 2);
}

// ---------- reference view ----------
const savedFor = (endpoint) => state.results.filter((r) => r.endpoint === endpoint);

function renderSidebar() {
  const sidebar = $("sidebar");
  sidebar.replaceChildren(h("h3", {}, "REST endpoints"));
  const rest = h("ul");
  for (const e of state.reference) {
    rest.append(h("li", { class: "item", "data-key": "rest:" + e.path, onclick: () => selectItem({ type: "rest", ...e }) },
      h("span", {}, h("code", {}, e.path), h("br"), h("small", {}, e.title)), h("small", {}, `${savedFor(e.path).length} saved`)));
  }
  sidebar.append(rest, h("h3", {}, "MCP tools"));
  const tools = h("ul");
  if (state.toolsError) tools.append(h("li", { class: "bad" }, state.toolsError));
  for (const t of state.tools) {
    tools.append(h("li", { class: "item", "data-key": "mcp:" + t.name, onclick: () => selectItem({ type: "mcp", ...t }) },
      h("span", {}, h("code", {}, t.name)), h("small", {}, `${savedFor(t.name).length} saved`)));
  }
  sidebar.append(tools);
}

function mcpParams(tool) {
  const schema = tool.inputSchema ?? {};
  return Object.entries(schema.properties ?? {}).map(([name, p]) => ({
    name, required: (schema.required ?? []).includes(name),
    type: p.type === "array" ? `array<${p.items?.type ?? "string"}>` : p.type,
    description: p.description ?? "", enum: p.enum ?? p.items?.enum, default: p.default,
    range: p.minimum != null || p.maximum != null ? `${p.minimum ?? ""}–${p.maximum ?? ""}` : p.maxItems ? `max ${p.maxItems} items` : "",
  }));
}

function selectItem(item) {
  state.selected = item;
  document.querySelectorAll("#sidebar li.item").forEach((el) => el.classList.toggle("active", el.dataset.key === `${item.type}:${item.path ?? item.name}`));
  const key = item.path ?? item.name;
  const params = item.type === "rest" ? item.parameters : mcpParams(item);
  const groups = item.type === "rest" ? [...new Set(params.map((p) => p.group).filter(Boolean))] : [];
  const detail = $("detail");
  const tbody = h("tbody");
  const count = h("span", { class: "muted" });
  const filter = h("input", { placeholder: `Filter ${params.length} parameters…`, oninput: draw });
  const only = h("select", { onchange: draw },
    h("option", { value: "" }, "All groups"), ...groups.map((g) => h("option", { value: g }, g)), h("option", { value: "__required" }, "Required only"));
  only.hidden = item.type !== "rest" || params.every((p) => !p.required && !p.group);

  function draw() {
    const q = filter.value.toLowerCase();
    const rows = params.filter((p) => {
      if (only.value === "__required" && !p.required) return false;
      if (groups.includes(only.value) && p.group !== only.value) return false;
      return !q || `${p.name} ${p.description} ${(p.enum ?? []).join(" ")}`.toLowerCase().includes(q);
    });
    count.textContent = `${rows.length} shown`;
    tbody.replaceChildren(...rows.map((p) => h("tr", {},
      h("td", { class: "name" }, p.name, p.required ? h("span", { class: "bad", title: "required" }, " *") : ""),
      h("td", { class: "mono" }, p.type ?? ""),
      h("td", {}, p.description, p.default !== undefined ? h("div", { class: "muted" }, `default: ${p.default}`) : "", p.range ? h("div", { class: "muted" }, p.range) : "",
        p.example !== undefined && item.type === "rest" ? h("div", { class: "muted" }, `example: ${typeof p.example === "object" ? JSON.stringify(p.example) : p.example}`) : ""),
      h("td", {}, p.enum ? p.enum.map((v) => h("span", { class: "chip" }, v)) : "", p.entityTypes ? h("div", { class: "muted" }, `types: ${p.entityTypes}`) : ""))));
  }

  const saved = savedFor(key);
  detail.replaceChildren(
    h("div", { class: "row", style: "justify-content:space-between" },
      h("h2", {}, item.type === "rest" ? `GET ${item.path}` : item.name),
      h("div", { class: "row" },
        item.docs ? h("a", { href: item.docs, target: "_blank", rel: "noreferrer" }, "Qloo docs ↗") : "",
        h("button", { class: "small", onclick: () => loadIntoPlayground({ kind: item.type, endpoint: key, params: item.type === "rest" ? REST_DEFAULTS[key] : item.example }) }, "Try in playground"))),
    h("div", { class: "muted" }, item.type === "rest" ? item.title : ""),
    h("p", {}, item.description || ""),
    h("h3", {}, `Parameters (${params.length})`),
    h("div", { class: "toolbar" }, filter, only, count),
    h("div", { class: "scroll" }, h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Name"), h("th", {}, "Type"), h("th", {}, "Description"), h("th", {}, "Allowed values / entity types"))), tbody)),
    h("h3", {}, `Saved calls (${saved.length})`),
    saved.length ? h("table", {}, h("thead", {}, h("tr", {}, h("th", {}, "Call"), h("th", {}, "Result"), h("th", {}, "Parameters used"), h("th", {}, "Sample"))),
      h("tbody", {}, saved.map((r) => h("tr", { class: "click", onclick: () => openSaved(r) },
        h("td", { class: "name" }, r.name), h("td", {}, badge(r), r.ms != null ? h("div", { class: "muted" }, `${r.ms} ms · ${r.count} items`) : h("div", { class: "muted" }, `${r.count} items`)),
        h("td", { class: "mono" }, compact(r.params)), h("td", {}, r.error ?? r.sample)))))
      : h("span", { class: "muted" }, "No saved calls yet. Run npm run probe to create some."),
  );
  draw();
}

// ---------- all results view ----------
function drawResults() {
  const q = $("res-filter").value.toLowerCase();
  const rows = state.results.filter((r) => {
    if ($("res-kind").value && r.kind !== $("res-kind").value) return false;
    if ($("res-ok").value === "ok" && !r.ok) return false;
    if ($("res-ok").value === "bad" && r.ok) return false;
    return !q || `${r.name} ${r.endpoint} ${compact(r.params)} ${r.sample ?? ""} ${r.error ?? ""}`.toLowerCase().includes(q);
  });
  $("res-count").textContent = `${rows.length} of ${state.results.length}`;
  $("res-body").replaceChildren(...rows.map((r) => h("tr", { class: "click", onclick: () => openSaved(r) },
    h("td", { class: "name" }, r.name), h("td", { class: "mono" }, `${r.kind === "rest" ? "REST " : "MCP "}${r.endpoint}`),
    h("td", {}, badge(r)), h("td", {}, r.ms ?? ""), h("td", {}, r.count), h("td", {}, r.error ?? r.sample))));
}

// ---------- playground ----------
let mode = "mcp", current = null;
function setMode(next) {
  mode = next;
  $("tab-mcp").classList.toggle("primary", mode === "mcp");
  $("tab-rest").classList.toggle("primary", mode === "rest");
  $("tools").hidden = mode !== "mcp";
  $("rest-form").hidden = mode !== "rest";
  if (mode === "rest") pickRest($("rest-path").value);
}
function pickTool(tool, li) {
  current = tool;
  document.querySelectorAll("#tools li").forEach((el) => el.classList.toggle("active", el === li));
  $("desc").textContent = tool.description ?? "";
  $("args").value = JSON.stringify(tool.example ?? {}, null, 2);
}
function pickRest(path) {
  $("desc").textContent = `GET ${path} with these query parameters (arrays are comma-joined). See the Reference tab for every allowed parameter.`;
  $("args").value = JSON.stringify(REST_DEFAULTS[path], null, 2);
}
async function run() {
  let args;
  try { args = JSON.parse($("args").value || "{}"); } catch (e) { $("meta").innerHTML = `<span class="bad">Invalid JSON: ${esc(e.message)}</span>`; return; }
  $("meta").textContent = "running…"; $("out").textContent = ""; $("cards").replaceChildren();
  try {
    if (mode === "mcp") {
      if (!current) throw new Error("Pick a tool first.");
      const { ms, envelope } = await api("/api/tool", { name: current.name, arguments: args });
      const good = ["ok", "partial", "degraded"].includes(envelope.status);
      $("meta").innerHTML = `<span class="pill ${good ? "ok" : "bad"}">${esc(envelope.status)}</span> ${ms} ms · ${esc(envelope.summary)}`;
      renderCards($("cards"), Array.isArray(envelope.results) ? envelope.results : envelope.series);
      $("out").textContent = JSON.stringify(envelope, null, 2);
    } else {
      const res = await api("/api/rest", { path: $("rest-path").value, params: args });
      $("meta").innerHTML = `<span class="pill ${res.ok ? "ok" : "bad"}">HTTP ${esc(res.status)}</span> ${res.ms} ms · ${esc(res.url ?? res.error)}`;
      renderCards($("cards"), listOf(res.body));
      $("out").textContent = JSON.stringify(res.body ?? res, null, 2);
    }
  } catch (e) { $("meta").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
}

// ---------- init ----------
async function init() {
  document.querySelectorAll("nav button").forEach((b) => (b.onclick = () => showView(b.dataset.view)));
  for (const id of ["res-filter", "res-kind", "res-ok"]) $(id).oninput = drawResults;
  $("v-close").onclick = () => $("viewer").close();
  $("v-load").onclick = () => loadIntoPlayground(state.viewing);
  for (const path of Object.keys(REST_DEFAULTS)) $("rest-path").add(new Option(path, path));
  $("rest-path").onchange = (e) => pickRest(e.target.value);
  $("tab-mcp").onclick = () => setMode("mcp");
  $("tab-rest").onclick = () => setMode("rest");
  $("run").onclick = run;
  try {
    const status = await api("/api/status");
    $("status").textContent = `${status.baseUrl} · key ${status.hasKey ? "set" : "MISSING"}`;
  } catch (e) { $("status").innerHTML = `<span class="bad">${esc(e.message)}</span>`; }

  const [reference, results] = await Promise.allSettled([api("/api/reference"), api("/api/results")]);
  if (reference.status === "fulfilled") state.reference = reference.value.endpoints;
  else $("detail").textContent = "Missing reference/endpoints.json — run: node scripts/build-reference.mjs";
  if (results.status === "fulfilled") state.results = results.value;
  renderSidebar(); drawResults();
  try {
    state.tools = await api("/api/tools");
    for (const tool of state.tools) {
      const li = h("li", { class: "item", "data-name": tool.name, onclick: () => pickTool(tool, li) },
        h("span", {}, h("strong", {}, tool.name), h("br"), h("small", {}, (tool.description ?? "").slice(0, 90))));
      $("tools").append(li);
    }
  } catch (e) { state.toolsError = "MCP tools unavailable: " + e.message; }
  renderSidebar();
  if (state.reference[0]) selectItem({ type: "rest", ...state.reference.find((e) => e.path === "/v2/insights") ?? state.reference[0] });
}
init();
</script>
</body>
