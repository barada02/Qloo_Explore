name: Qloo probe

# Runs the explorer's live probes against the Qloo hackathon API and commits
# the reports to explorer/results/. Needs the repository secret QLOO_API_KEY.
on:
  workflow_dispatch:
  push:
    paths:
      - "explorer/**"
      - "!explorer/results/**"
      - ".github/workflows/qloo-probe.yml"

permissions:
  contents: write

concurrency:
  group: qloo-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: explorer
    env:
      QLOO_API_KEY: ${{ secrets.QLOO_API_KEY }}
      QLOO_BASE_URL: https://hackathon.api.qloo.com
      QLOO_HOME: ${{ github.workspace }}/.qloo-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
      - name: Offline plumbing tests
        run: npm test
      - name: Check secret
        id: secret
        run: |
          if [ -z "$QLOO_API_KEY" ]; then
            echo "::warning::QLOO_API_KEY secret is not set; skipping live probes."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Live REST probe
        if: steps.secret.outputs.present == 'true'
        run: node probe-rest.mjs || echo "::warning::Some REST steps failed; see report."
      - name: Live MCP probe
        if: steps.secret.outputs.present == 'true'
        run: node probe-mcp.mjs || echo "::warning::Some MCP calls failed; see report."
      - name: Live parameter probe
        if: steps.secret.outputs.present == 'true'
        run: node probe-params.mjs || echo "::warning::Some parameter steps failed; see report."
      - name: Job summary
        if: steps.secret.outputs.present == 'true'
        run: cat results/REST_REPORT.md results/MCP_REPORT.md results/PARAMS_REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Guard against leaking the key
        if: steps.secret.outputs.present == 'true'
        run: |
          if grep -rqF "$QLOO_API_KEY" results; then echo "Key found in results; refusing to commit."; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: steps.secret.outputs.present == 'true'
        with:
          name: qloo-probe-results
          path: explorer/results
      - name: Commit results
        if: steps.secret.outputs.present == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Update Qloo probe results [skip ci]"
          git push
